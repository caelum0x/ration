name: Docker build

# Builds (and, on main, pushes) one image per service Dockerfile.
#
# SCALE-EXPANSION.md section 3 (infra-as-code) is what actually adds
# `Dockerfile` under each `services/<name>/` directory; as of this workflow
# being authored none exist yet. Rather than hardcode a service list that
# would hard-fail with "Dockerfile not found" until section 3 lands (or go
# stale the moment a service is renamed/added), this workflow discovers
# `services/*/Dockerfile` at run time. With zero Dockerfiles present, the
# `build` job's matrix resolves to an empty list and the job runs zero
# times — an honest "nothing to build yet" rather than a fake green check
# or a hard failure on files that are a different unit of work's job to add.
#
# TODO(registry): the push target below is GitHub Container Registry under
# this repo (ghcr.io/<owner>/<repo>/<service>), using the repo's own
# GITHUB_TOKEN — a real, working default that needs no owner setup. If the
# owner wants a different registry (ECR, Docker Hub, etc.) that's a config
# change to the `images: ...` tag and the login step's `registry`/
# `username`/`password` inputs, not a structural change to this workflow.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  discover:
    name: Discover service Dockerfiles
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Find services/*/Dockerfile
        run: |
          services=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile -print0 \
            | xargs -0 -n1 dirname | xargs -n1 basename | sort \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Discovered service Dockerfiles: $services"

  build:
    name: Build ${{ matrix.service }}
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
