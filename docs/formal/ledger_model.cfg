\* TLC config for ledger_model.tla (which EXTENDS ledger.tla). Run from
\* docs/formal/ with:
\*   java -cp tla2tools.jar tlc2.TLC -config ledger_model.cfg ledger_model.tla
\*
\* Small, concrete constants chosen to make the state space finite and
\* fast to check exhaustively while exercising every action: two tenants
\* with different reserve floors (one positive, one zero) and two hold
\* ids (so one hold can be released while another is captured in the
\* same run, and a third HOLD attempt once both ids are used is exercised
\* as the "no id available" no-op).

CONSTANTS
    Tenants = {t1, t2}
    HoldIds = {h1, h2}
    MaxAmount = 3
    MaxBalance = 9
    t1 = t1
    t2 = t2
    h1 = h1
    h2 = h2

CONSTANT ReserveFloor <- ReserveFloorDef

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT SafetyReserveFloor
INVARIANT SafetyHeldNonNegative

PROPERTY HoldsResolve

CONSTRAINT StateConstraint
