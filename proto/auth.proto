syntax = "proto3";

package ration.auth.v1;

option go_package = "github.com/caelum0x/ration/pkg/pb/auth";

// Auth is an internal-only service (docs/SCALE-EXPANSION.md section 1):
// tenant API-key issuance/verification, JWT minting/verification for the
// TUI/CLI, and mTLS client-cert issuance for service-to-service calls.
// Nothing in gateway.proto (the one public aggregate surface) changes
// because of this service existing — it is new capability, not an
// extraction of existing gateway behavior (see docs/adr/0004).
service Auth {
  // IssueAPIKey mints a new API key for a tenant. The plaintext secret is
  // only ever returned in this response — only its salted hash is kept,
  // so a leaked store (or log) can never be replayed into a working key.
  rpc IssueAPIKey(IssueAPIKeyRequest) returns (IssueAPIKeyResponse);
  // VerifyAPIKey checks a presented secret against the stored hash and
  // reports whether it is valid (and not revoked), and if so, which
  // tenant it authenticates.
  rpc VerifyAPIKey(VerifyAPIKeyRequest) returns (VerifyAPIKeyResponse);
  // RevokeAPIKey immediately invalidates a key; VerifyAPIKey will report
  // it invalid from that point on, even if the secret is still correct.
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  // ListAPIKeys returns every issued key's metadata (never the plaintext
  // secret, which is never stored anywhere to return) — the missing
  // read side of IssueAPIKey/RevokeAPIKey. Without this, an operator who
  // issued a key in one session (or inherited a deployment someone else
  // set up) has no way to discover what key_ids even exist to revoke, or
  // to audit which keys are still live versus already revoked; they can
  // only ever act on a key_id they personally still have printed
  // somewhere. Filterable by tenant_id (empty returns every key,
  // operator keys included).
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);

  // MintJWT issues a signed, short-lived bearer token for a subject
  // (e.g. a human operator driving the TUI/CLI) scoped to a tenant.
  rpc MintJWT(MintJWTRequest) returns (MintJWTResponse);
  // VerifyJWT checks a token's signature and expiry and reports the
  // claims it was minted with.
  rpc VerifyJWT(VerifyJWTRequest) returns (VerifyJWTResponse);

  // IssueServiceCert signs a service's certificate signing request (CSR)
  // against this service's internal CA, returning a leaf certificate a
  // service can present for mTLS (see pkg/mtls, infra/dev-ca/). Unlike
  // infra/dev-ca/generate-dev-ca.sh's static, offline cert generation,
  // this is runtime issuance: a service can request (or be issued, via
  // an operator-driven rotation) a fresh short-lived cert without a
  // redeploy, and a compromised service's cert can be left to expire
  // (or, with a future CRL/OCSP addition, revoked) without touching
  // every other service's identity.
  rpc IssueServiceCert(IssueServiceCertRequest) returns (IssueServiceCertResponse);
}

message IssueAPIKeyRequest {
  string tenant_id = 1;
  string name = 2; // human-readable label, e.g. "ration CLI, Ada's laptop"
  // is_operator mints an operator-scoped key: one that authenticates as
  // a trusted cross-tenant caller (the CLI/TUI operator dashboards, the
  // agent's polling loop) rather than a single tenant. internal/tenantauth
  // on gateway (and any future ledger-core-side equivalent) treats an
  // operator-scoped credential as pre-authorized for every tenant_id a
  // request carries, instead of requiring an exact match — this is how
  // "show me every tenant's live activity" (the TUI dashboard) and "act
  // on whichever tenant has a late deposit this tick" (the agent) stay
  // possible once tenant-scoped authorization is actually enforced.
  // tenant_id is ignored (and should be left empty) when this is true.
  bool is_operator = 3;
}

message IssueAPIKeyResponse {
  string key_id = 1;
  string tenant_id = 2;
  // secret is the plaintext API key. Returned exactly once, at issuance
  // — Auth never stores or returns it again.
  string secret = 3;
  int64 created_at_unix = 4;
  bool is_operator = 5;
}

message VerifyAPIKeyRequest {
  string secret = 1;
}

message VerifyAPIKeyResponse {
  bool valid = 1;
  string key_id = 2;
  string tenant_id = 3;
  // reason explains an invalid result (e.g. "revoked", "not found"); empty when valid.
  string reason = 4;
  // is_operator mirrors IssueAPIKeyRequest.is_operator for the key that
  // was verified; always false when valid is false.
  bool is_operator = 5;
}

message RevokeAPIKeyRequest {
  string key_id = 1;
}

message RevokeAPIKeyResponse {
  bool revoked = 1;
}

message ListAPIKeysRequest {
  // tenant_id filters to one tenant's keys; empty returns every issued
  // key (tenant-scoped and operator-scoped alike) — an operator-only
  // view, since no tenant-scoped credential should ever see another
  // tenant's key metadata (caller-side authorization, same as every
  // other operator-only RPC in this service).
  string tenant_id = 1;
}

message APIKeyRecord {
  string key_id = 1;
  string tenant_id = 2; // empty for an operator-scoped key
  string name = 3;
  int64 created_at_unix = 4;
  bool revoked = 5;
  bool is_operator = 6;
  // secret is deliberately absent: it was never stored anywhere after
  // IssueAPIKeyResponse returned it once, so there is nothing to list.
}

message ListAPIKeysResponse {
  repeated APIKeyRecord keys = 1;
}

message MintJWTRequest {
  string subject = 1;
  string tenant_id = 2;
  int64 ttl_seconds = 3; // 0 = server default (see services/auth/internal/jwt)
  // is_operator mints an operator-scoped JWT — see
  // IssueAPIKeyRequest.is_operator's doc comment for what that means and
  // why it exists. tenant_id is ignored (and should be left empty) when
  // this is true.
  bool is_operator = 4;
}

message MintJWTResponse {
  string token = 1;
  int64 expires_at_unix = 2;
}

message VerifyJWTRequest {
  string token = 1;
}

message VerifyJWTResponse {
  bool valid = 1;
  string subject = 2;
  string tenant_id = 3;
  string reason = 4; // explains an invalid result (e.g. "expired", "bad signature")
  // is_operator mirrors MintJWTRequest.is_operator for the token that was
  // verified; always false when valid is false.
  bool is_operator = 5;
}

message IssueServiceCertRequest {
  string service_name = 1; // SAN the issued cert will carry, e.g. "card-issuance"
  // csr_pem is a PEM-encoded PKCS#10 certificate signing request. The
  // service generates and keeps its own private key; only the CSR
  // (public key + requested SAN) ever crosses this RPC.
  bytes csr_pem = 2;
  int64 ttl_seconds = 3; // 0 = server default
}

message IssueServiceCertResponse {
  bytes cert_pem = 1; // the signed leaf certificate
  bytes ca_pem = 2;   // the issuing CA certificate, for building a trust pool
  int64 expires_at_unix = 3;
}
