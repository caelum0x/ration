syntax = "proto3";

package ration.cardissuance.v1;

import "common.proto";

option go_package = "github.com/caelum0x/ration/pkg/pb/cardissuance";

// CardIssuance is an internal-only service (docs/SCALE-EXPANSION.md
// section 1): a direct extraction of services/gateway's old
// internal/card (Airwallex issuing-card management) and internal/bridge
// (the rationing/bridge-funding math) — the highest-value service in the
// system per docs/adr/0004, since this is where real money decisions
// happen. Stateless and idempotent per tenant: correctness under
// concurrent calls for one tenant rests on ledger-core's idempotent,
// reserve-floor-checked ApplyEntry, not on any lock here, so this
// service is safe to run as N replicas.
//
// gateway.proto (the one public surface the TUI/CLI/agent dial) is
// unchanged by this split — services/gateway is the thin BFF that calls
// this service's RPCs and republishes their results on its own
// activity bus.
service CardIssuance {
  rpc IssueCard(IssueCardRequest) returns (Card);
  rpc AdjustCardLimit(AdjustCardLimitRequest) returns (Card);
  rpc GetCard(GetCardRequest) returns (Card);
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse);

  rpc RationBridgeFunding(RationBridgeFundingRequest) returns (RationBridgeFundingResponse);
}

message Card {
  string id = 1;
  string tenant_id = 2;
  string airwallex_card_id = 3;
  string cardholder_name = 4;
  ration.common.v1.CardStatus status = 5;
  int64 limit_minor_units = 6;
  string limit_interval = 7; // "daily" | "monthly"
  string currency = 8;
  int64 created_at_unix = 9;
}

message IssueCardRequest {
  string tenant_id = 1;
  string cardholder_name = 2;
  int64 limit_minor_units = 3;
  string limit_interval = 4;
  string currency = 5;
}

message AdjustCardLimitRequest {
  string card_id = 1;
  int64 new_limit_minor_units = 2;
  string reason = 3;
}

message GetCardRequest {
  string card_id = 1;
}

message ListCardsRequest {
  string tenant_id = 1;
}

message ListCardsResponse {
  repeated Card cards = 1;
}

message RationBridgeFundingRequest {
  string tenant_id = 1;
  int64 requested_minor_units = 2;
  string reason = 3;
}

message RationBridgeFundingResponse {
  int64 granted_minor_units = 1;
  bool fully_granted = 2;
  string explanation = 3;
}
